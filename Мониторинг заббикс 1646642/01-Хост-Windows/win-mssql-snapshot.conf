# UserParameter for Zabbix agent / agent 2 on Windows.
# Copy into zabbix_agent2.conf or zabbix_agent2.d\win-mssql-snapshot.conf
# Timeout must cover two Get-Counter samples (default agent timeout is 3s).

Timeout=10
UnsafeUserParameters=1
UserParameter=win.mssql.snapshot,powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\zabbix\Collect-WinMssqlSnapshot.ps1" -Stdout
