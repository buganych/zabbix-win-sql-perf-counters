zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 'ce46b9cc71cd4c8092de20b931c16895'
      name: Templates/Databases
  templates:
    - uuid: '661504b4d42d40ebbe48bbc790ddfc7d'
      template: 'Windows OS and MSSQL snapshot'
      name: 'Windows OS and MSSQL snapshot'
      description: |
        Один элемент win.mssql.snapshot снимает JSON коллектора Collect-WinMssqlSnapshot.ps1.
        Для постоянных графиков предпочтительны шаблоны Windows by Zabbix agent и MSSQL by Zabbix agent 2.
      groups:
        - name: Templates/Databases
      items:
        - uuid: 'd138badf11d64273a12537c8fc19f223'
          name: 'Get OS+MSSQL snapshot'
          type: ZABBIX_ACTIVE
          key: win.mssql.snapshot
          delay: 1m
          history: 1d
          trends: '0'
          value_type: TEXT
          description: JSON коллектора PerfMon + MSSQL. Timeout агента >= 10s.
        - uuid: 'ca3d4857fc2a473ca86206e7e2d69786'
          name: 'Загрузка CPU'
          type: DEPENDENT
          key: 'snapshot.os.cpu.util'
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.values["os.cpu.util"]'
          master_item:
            key: win.mssql.snapshot
        - uuid: 'd11f82b5a33f45df827d1783f760655c'
          name: 'CPU privileged time'
          type: DEPENDENT
          key: 'snapshot.os.cpu.privileged'
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.values["os.cpu.privileged"]'
          master_item:
            key: win.mssql.snapshot
        - uuid: '4170034a100d40fa982f1876202403de'
          name: 'CPU user time'
          type: DEPENDENT
          key: 'snapshot.os.cpu.user'
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
