              parameters:
                - '$.values["os.cpu.user"]'
          master_item:
            key: win.mssql.snapshot
        - uuid: '6dec5e0fb76549c98d53ea17abd1597d'
          name: 'Processor Queue Length'
          type: DEPENDENT
          key: 'snapshot.os.cpu.queue'
          delay: '0'
          history: 90d
          value_type: FLOAT
          preprocessing:
